<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="680" viewBox="0 0 1400 680" role="img" aria-labelledby="title description">
  <title id="title">ForgeGrid parallelism waterfall</title>
  <desc id="description">The same seven-task cold build takes 2.5 seconds on one worker and 1.0 second when distributed across three workers, reducing wall-clock time by 59 percent.</desc>
  <rect width="1400" height="680" fill="#f7f2e8"/>

  <text x="72" y="62" fill="#075faf" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2">MEASURED SCALE-OUT TEST</text>
  <text x="72" y="118" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="700">Parallel work finishes sooner.</text>
  <text x="72" y="158" fill="#665b52" font-family="Arial, Helvetica, sans-serif" font-size="20">The same seven-task cold build, measured on one shared clock.</text>
  <text x="1328" y="72" fill="#2d7a45" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="end">59% less time</text>
  <text x="1328" y="109" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="end">2.44× faster</text>

  <line x1="248" y1="190" x2="248" y2="592" stroke="#d3c9bd" stroke-width="2"/>
  <line x1="456" y1="190" x2="456" y2="592" stroke="#ded6cc" stroke-width="1"/>
  <line x1="664" y1="190" x2="664" y2="592" stroke="#2d7a45" stroke-width="2" stroke-dasharray="7 7"/>
  <line x1="872" y1="190" x2="872" y2="592" stroke="#ded6cc" stroke-width="1"/>
  <line x1="1080" y1="190" x2="1080" y2="592" stroke="#ded6cc" stroke-width="1"/>
  <line x1="1288" y1="190" x2="1288" y2="592" stroke="#c97328" stroke-width="2" stroke-dasharray="7 7"/>

  <text x="224" y="242" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">1 worker</text>
  <rect x="248" y="207" width="1040" height="62" rx="8" fill="#c97328"/>
  <line x1="542" y1="207" x2="542" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <line x1="803" y1="207" x2="803" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <line x1="929" y1="207" x2="929" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <line x1="1181" y1="207" x2="1181" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <line x1="1219" y1="207" x2="1219" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <line x1="1285" y1="207" x2="1285" y2="269" stroke="#f7f2e8" stroke-width="2"/>
  <text x="395" y="244" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Scripts</text>
  <text x="672" y="244" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Shaders</text>
  <text x="866" y="244" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Textures</text>
  <text x="1055" y="244" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="middle">Audio</text>
  <text x="1234" y="244" fill="#fffaf3" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Finish tasks</text>

  <text x="224" y="357" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">Worker 1</text>
  <rect x="248" y="326" width="141" height="54" rx="7" fill="#0b6ec8"/>
  <rect x="389" y="326" width="270" height="54" rx="7" fill="#0b6ec8" opacity="0.82"/>
  <rect x="659" y="326" width="5" height="54" rx="2" fill="#0b6ec8" opacity="0.65"/>
  <text x="318" y="359" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Textures</text>
  <text x="524" y="359" fill="#f8fbff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Audio</text>

  <text x="224" y="439" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">Worker 2</text>
  <rect x="248" y="408" width="291" height="54" rx="7" fill="#148a87"/>
  <rect x="539" y="408" width="42" height="54" rx="7" fill="#148a87" opacity="0.78"/>
  <text x="393" y="441" fill="#f6fffe" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Shaders</text>
  <text x="560" y="441" fill="#f6fffe" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Level</text>

  <text x="224" y="521" fill="#2f241d" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" text-anchor="end">Worker 3</text>
  <rect x="248" y="490" width="324" height="54" rx="7" fill="#6957c7"/>
  <rect x="572" y="490" width="75" height="54" rx="7" fill="#6957c7" opacity="0.78"/>
  <text x="410" y="523" fill="#faf9ff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle">Scripts</text>
  <text x="609" y="523" fill="#faf9ff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Navigation</text>

  <rect x="664" y="300" width="624" height="264" fill="#2d7a45" opacity="0.055"/>
  <text x="680" y="302" fill="#2d7a45" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">THREE-WORKER FINISH · 1.0 s</text>
  <text x="1272" y="302" fill="#a75d20" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" text-anchor="end">ONE-WORKER FINISH · 2.5 s</text>
  <line x1="678" y1="577" x2="1274" y2="577" stroke="#2d7a45" stroke-width="2"/>
  <path d="M678 577 L692 569 L692 585 Z" fill="#2d7a45"/>
  <path d="M1274 577 L1260 569 L1260 585 Z" fill="#2d7a45"/>
  <text x="976" y="568" fill="#2d7a45" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" text-anchor="middle">1.5 seconds saved</text>

  <line x1="248" y1="608" x2="1288" y2="608" stroke="#bcb1a5" stroke-width="2"/>
  <g fill="#665b52" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle">
    <text x="248" y="638">0 s</text>
    <text x="456" y="638">0.5 s</text>
    <text x="664" y="638">1.0 s</text>
    <text x="872" y="638">1.5 s</text>
    <text x="1080" y="638">2.0 s</text>
    <text x="1288" y="638">2.5 s</text>
  </g>
</svg>
